name: Build self-hosted Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        working-directory: kitchenowl
        run: flutter pub get

      - name: Configure Android signing
        working-directory: kitchenowl/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "ANDROID_STORE_PASSWORD is not configured" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > kitchenowl-upload.jks
          {
            printf 'storeFile=../kitchenowl-upload.jks\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > key.properties

      - name: Build release APK
        working-directory: kitchenowl
        run: flutter build apk --release

      - name: Name APK
        id: apk
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="kitchenowl/build/app/outputs/flutter-apk/kitchenowl-${REF_NAME}.apk"
          cp kitchenowl/build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchenowl-android-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KitchenOwl Android $GITHUB_REF_NAME" \
            --generate-notes
