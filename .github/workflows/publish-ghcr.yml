name: Publish KitchenOwl images to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "kitchenowl/**"
      - "backend/Dockerfile"
      - "kitchenowl/Dockerfile"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: ./kitchenowl
            file: ./kitchenowl/Dockerfile
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitchenowl-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/kitchenowl-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
